<head>

<title>Client Retention | AP Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: hub of slide-cover tiles -> one session per view: player on top, clickable outline under it */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #0f1f3d; --soft: #5b6884; --line: #e1e6ef;
  --navy: #13294b; --blue: #1f5fbf; --sky: #2f8ae0; --gold: #e8aa42; --hover: #eaf1fc;
  --shadow: 0 10px 30px rgba(19, 41, 75, .14);
  --font: "Poppins", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px }
header.top { background: linear-gradient(120deg, #13294b, #1f5fbf 70%, #2f8ae0); color: #fff; padding-top: env(safe-area-inset-top, 0px) }
header.top .bar { max-width: 1180px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap }
.brand { display: flex; flex-direction: column; line-height: 1.15 }
.brand .who { font-weight: 300; font-size: 14px; opacity: .85 }
.brand .what { font-weight: 600; font-size: 22px; letter-spacing: .01em }
nav a { color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.12) }
nav a:hover, nav a:focus-visible { background: rgba(255,255,255,.24); outline: none }
/* hub */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; padding-top: 28px }
.tile { display: block; text-decoration: none; color: inherit; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(31, 95, 191, .28); outline: none }
.tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.tile .img { aspect-ratio: 16 / 9; background: var(--navy); overflow: hidden }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block }
.tile .name { padding: 14px 16px 16px; font-weight: 600; font-size: 16px; line-height: 1.3; text-wrap: balance }
/* session */
.session { padding-top: 26px; display: grid; gap: 22px; max-width: 960px; margin: 0 auto }
.session h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.25; text-wrap: balance; color: var(--ink) }
.player { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow) }
.player iframe, .player > div { position: absolute; inset: 0; width: 100%; height: 100% }
.outline { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.sec { background: var(--surface); border-radius: 12px; padding: 6px; box-shadow: 0 1px 0 var(--line) }
.sec.on { box-shadow: 0 0 0 2px var(--blue) }
.jump { display: flex; gap: 14px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 10px 12px; border-radius: 9px; cursor: pointer }
.jump:hover, .jump:focus-visible { background: var(--hover); outline: none }
.jump .t { flex: 0 0 auto; min-width: 58px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--blue); font-size: 14px }
.jump .x { min-width: 0 }
.sec > .jump .x { font-weight: 600; font-size: 16px }
.pts { list-style: none; margin: 0; padding: 0 0 4px 0 }
.pts .jump { padding: 7px 12px 7px 12px }
.pts .jump .t { font-weight: 500; color: var(--soft) }
.pts .jump .x { color: var(--ink); font-size: 14.5px }
.pts .jump:hover .t { color: var(--blue) }
@media (max-width: 560px) {
  .session h1 { font-size: 21px }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px }
  .tile .name { font-size: 14px; padding: 10px 12px 12px }
  .jump .t { min-width: 48px }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none } .tile:hover { transform: none } }
</style>
</head>

  <div class="bar">
    <div class="brand"><span class="who">Aaron Prickel · Mastery</span><span class="what">Client Retention</span></div>
  </div>
</header>
<main class="wrap">
  <section class="session">
    <div class="player"><div id="yt"></div></div>
    <ol class="outline"><li class="sec" data-s="0"><button class="jump" data-s="0"><span class="t">0:00</span><span class="x">Why client retention matters</span></button><ul class="pts"><li><button class="jump" data-s="58"><span class="t">0:58</span><span class="x">Quarterback and lineman: a strong seller makes the account manager&#x27;s job easier.</span></button></li><li><button class="jump" data-s="83"><span class="t">1:23</span><span class="x">Plug the holes in the bucket, then add more water.</span></button></li></ul></li>
<li class="sec" data-s="130"><button class="jump" data-s="130"><span class="t">2:10</span><span class="x">Why clients leave</span></button><ul class="pts"><li><button class="jump" data-s="140"><span class="t">2:20</span><span class="x">Too expensive means they don&#x27;t see value; can&#x27;t afford means cash is tight.</span></button></li><li><button class="jump" data-s="187"><span class="t">3:07</span><span class="x">Ask &quot;compared to what?&quot; then find out if it&#x27;s belief or cash flow.</span></button></li><li><button class="jump" data-s="228"><span class="t">3:48</span><span class="x">Many weren&#x27;t committed from the start; whose idea was it more?</span></button></li><li><button class="jump" data-s="343"><span class="t">5:43</span><span class="x">Expectations: classic post-sell; frustration comes from mismanaged expectations.</span></button></li></ul></li>
<li class="sec" data-s="412"><button class="jump" data-s="412"><span class="t">6:52</span><span class="x">Keep clients thinking and life easy</span></button><ul class="pts"><li><button class="jump" data-s="442"><span class="t">7:22</span><span class="x">Treat your clients like prospects, like dating your spouse.</span></button></li><li><button class="jump" data-s="486"><span class="t">8:06</span><span class="x">Don&#x27;t overwhelm new contacts; show shortcuts and bring them up to speed.</span></button></li></ul></li>
<li class="sec" data-s="523"><button class="jump" data-s="523"><span class="t">8:43</span><span class="x">Rapport versus trust ladder</span></button><ul class="pts"><li><button class="jump" data-s="571"><span class="t">9:31</span><span class="x">Ladder: vendor, solution, consultant (needs), relationship, trust.</span></button></li><li><button class="jump" data-s="597"><span class="t">9:57</span><span class="x">If you say &quot;offer,&quot; you&#x27;re in the second-lowest relationship.</span></button></li><li><button class="jump" data-s="668"><span class="t">11:08</span><span class="x">Rapport is likability; trust is credibility and follow-through.</span></button></li></ul></li>
<li class="sec" data-s="750"><button class="jump" data-s="750"><span class="t">12:30</span><span class="x">Set expectations and tough love</span></button><ul class="pts"><li><button class="jump" data-s="846"><span class="t">14:06</span><span class="x">&quot;Once you get the yes, stop talking&quot; means stop selling, not stop setting expectations.</span></button></li><li><button class="jump" data-s="876"><span class="t">14:36</span><span class="x">Clients buy some tough love and accountability.</span></button></li><li><button class="jump" data-s="1001"><span class="t">16:41</span><span class="x">Reignite old leads by returning to the original emotional pain.</span></button></li></ul></li>
<li class="sec" data-s="1154"><button class="jump" data-s="1154"><span class="t">19:14</span><span class="x">New toy phase</span></button><ul class="pts"><li><button class="jump" data-s="1167"><span class="t">19:27</span><span class="x">Best time to set expectations; referrals come from experience beating expectations.</span></button></li><li><button class="jump" data-s="1246"><span class="t">20:46</span><span class="x">Referrals mostly confirm their original decision.</span></button></li></ul></li>
<li class="sec" data-s="1308"><button class="jump" data-s="1308"><span class="t">21:48</span><span class="x">Frustrated and learning phase</span></button><ul class="pts"><li><button class="jump" data-s="1338"><span class="t">22:18</span><span class="x">People question their decision but are willing to be eased.</span></button></li><li><button class="jump" data-s="1357"><span class="t">22:37</span><span class="x">Give slightly more than expected; today&#x27;s value-add becomes tomorrow&#x27;s expectation.</span></button></li></ul></li>
<li class="sec" data-s="1399"><button class="jump" data-s="1399"><span class="t">23:19</span><span class="x">Results phase and quick wins</span></button><ul class="pts"><li><button class="jump" data-s="1399"><span class="t">23:19</span><span class="x">The faster clients reach results, the longer they stay.</span></button></li><li><button class="jump" data-s="1431"><span class="t">23:51</span><span class="x">Get early quick wins; Aaron uses an Eight Ways to Jumpstart Clients document.</span></button></li><li><button class="jump" data-s="1749"><span class="t">29:09</span><span class="x">Tell clients which phases are coming so they expect them.</span></button></li></ul></li>
<li class="sec" data-s="1532"><button class="jump" data-s="1532"><span class="t">25:32</span><span class="x">Build an army of advocates</span></button><ul class="pts"><li><button class="jump" data-s="1545"><span class="t">25:45</span><span class="x">A change in decision maker is a top reason for lost business.</span></button></li><li><button class="jump" data-s="1567"><span class="t">26:07</span><span class="x">Want ten people saying your name inside every account.</span></button></li><li><button class="jump" data-s="1624"><span class="t">27:04</span><span class="x">Teach who to call for what, and sprinkle shortcuts over time.</span></button></li><li><button class="jump" data-s="1707"><span class="t">28:27</span><span class="x">Track one &quot;sticky moment&quot; per client each month.</span></button></li></ul></li>
<li class="sec" data-s="1843"><button class="jump" data-s="1843"><span class="t">30:43</span><span class="x">Referrals and engagement</span></button><ul class="pts"><li><button class="jump" data-s="1843"><span class="t">30:43</span><span class="x">Later referrals are fewer but higher quality.</span></button></li><li><button class="jump" data-s="1852"><span class="t">30:52</span><span class="x">Engage a skeptic by giving them homework and involvement.</span></button></li><li><button class="jump" data-s="1884"><span class="t">31:24</span><span class="x">Let the client define success, unless it&#x27;s unrealistic.</span></button></li></ul></li>
<li class="sec" data-s="1910"><button class="jump" data-s="1910"><span class="t">31:50</span><span class="x">Caesar meetings</span></button><ul class="pts"><li><button class="jump" data-s="1919"><span class="t">31:59</span><span class="x">Four steps with the highest-ranking person: thank them for the business.</span></button></li><li><button class="jump" data-s="1940"><span class="t">32:20</span><span class="x">Ask what we&#x27;d have to do to get fired.</span></button></li><li><button class="jump" data-s="1977"><span class="t">32:57</span><span class="x">For a high S, ask what would make you lose trust in us.</span></button></li><li><button class="jump" data-s="2052"><span class="t">34:12</span><span class="x">Ask about other current opportunities; lead with results, not offerings.</span></button></li><li><button class="jump" data-s="2171"><span class="t">36:11</span><span class="x">Ask how else we can put money back in your pocket.</span></button></li></ul></li>
<li class="sec" data-s="2264"><button class="jump" data-s="2264"><span class="t">37:44</span><span class="x">Wrap-up</span></button><ul class="pts"><li><button class="jump" data-s="2264"><span class="t">37:44</span><span class="x">The more they use you, the harder it is to leave.</span></button></li><li><button class="jump" data-s="2285"><span class="t">38:05</span><span class="x">Tell clients what will happen; when it does, you look like a guru.</span></button></li></ul></li></ol>
  </section>
</main>
<script>
let player = null, ticker = null;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', { videoId: 'jevFv4eZvII', host: 'https://www.youtube-nocookie.com',
    playerVars: { rel: 0, playsinline: 1, origin: location.origin },
    events: { onReady: () => { ticker = setInterval(mark, 1000); } } });
}
function mark() {
  if (!player || !player.getCurrentTime) return;
  const now = player.getCurrentTime(); let cur = -1;
  const secs = document.querySelectorAll('.sec');
  secs.forEach((el, i) => { if (+el.dataset.s <= now + 0.5) cur = i; });
  secs.forEach((el, i) => el.classList.toggle('on', i === cur));
}
document.addEventListener('click', e => {
  const b = e.target.closest('.jump'); if (!b) return;
  if (player && player.seekTo) { player.seekTo(+b.dataset.s, true); player.playVideo(); }
  const box = document.querySelector('.player');
  if (box.getBoundingClientRect().top < 0) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
