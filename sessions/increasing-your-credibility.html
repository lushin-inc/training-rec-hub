<style>
/* Layout: hub of slide-cover tiles -> one session per view: player on top, clickable outline under it */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #0f1f3d; --soft: #5b6884; --line: #e1e6ef;
  --navy: #13294b; --blue: #1f5fbf; --sky: #2f8ae0; --gold: #e8aa42; --hover: #eaf1fc;
  --shadow: 0 10px 30px rgba(19, 41, 75, .14);
  --font: "Poppins", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px }
header.top { background: linear-gradient(120deg, #13294b, #1f5fbf 70%, #2f8ae0); color: #fff; padding-top: env(safe-area-inset-top, 0px) }
header.top .bar { max-width: 1180px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap }
.brand { display: flex; flex-direction: column; line-height: 1.15 }
.brand .who { font-weight: 300; font-size: 14px; opacity: .85 }
.brand .what { font-weight: 600; font-size: 22px; letter-spacing: .01em }
nav a { color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.12) }
nav a:hover, nav a:focus-visible { background: rgba(255,255,255,.24); outline: none }
/* hub */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; padding-top: 28px }
.tile { display: block; text-decoration: none; color: inherit; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(31, 95, 191, .28); outline: none }
.tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.tile .img { aspect-ratio: 16 / 9; background: var(--navy); overflow: hidden }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block }
.tile .name { padding: 14px 16px 16px; font-weight: 600; font-size: 16px; line-height: 1.3; text-wrap: balance }
/* session */
.session { padding-top: 26px; display: grid; gap: 22px; max-width: 960px; margin: 0 auto }
.session h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.25; text-wrap: balance; color: var(--ink) }
.player { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow) }
.player iframe, .player > div { position: absolute; inset: 0; width: 100%; height: 100% }
.outline { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.sec { background: var(--surface); border-radius: 12px; padding: 6px; box-shadow: 0 1px 0 var(--line) }
.sec.on { box-shadow: 0 0 0 2px var(--blue) }
.jump { display: flex; gap: 14px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 10px 12px; border-radius: 9px; cursor: pointer }
.jump:hover, .jump:focus-visible { background: var(--hover); outline: none }
.jump .t { flex: 0 0 auto; min-width: 58px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--blue); font-size: 14px }
.jump .x { min-width: 0 }
.sec > .jump .x { font-weight: 600; font-size: 16px }
.pts { list-style: none; margin: 0; padding: 0 0 4px 0 }
.pts .jump { padding: 7px 12px 7px 12px }
.pts .jump .t { font-weight: 500; color: var(--soft) }
.pts .jump .x { color: var(--ink); font-size: 14.5px }
.pts .jump:hover .t { color: var(--blue) }
@media (max-width: 560px) {
  .session h1 { font-size: 21px }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px }
  .tile .name { font-size: 14px; padding: 10px 12px 12px }
  .jump .t { min-width: 48px }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none } .tile:hover { transform: none } }
</style>

<script>
let player = null, ticker = null;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', { videoId: 'WE7aIEN0Qzc', host: 'https://www.youtube-nocookie.com',
    playerVars: { rel: 0, playsinline: 1, origin: location.origin },
    events: { onReady: () => { ticker = setInterval(mark, 1000); } } });
}
function mark() {
  if (!player || !player.getCurrentTime) return;
  const now = player.getCurrentTime(); let cur = -1;
  const secs = document.querySelectorAll('.sec');
  secs.forEach((el, i) => { if (+el.dataset.s <= now + 0.5) cur = i; });
  secs.forEach((el, i) => el.classList.toggle('on', i === cur));
}
document.addEventListener('click', e => {
  const b = e.target.closest('.jump'); if (!b) return;
  if (player && player.seekTo) { player.seekTo(+b.dataset.s, true); player.playVideo(); }
  const box = document.querySelector('.player');
  if (box.getBoundingClientRect().top < 0) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
