<head>

<style>
/* Layout: hub of slide-cover tiles -> one session per view: player on top, clickable outline under it */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #0f1f3d; --soft: #5b6884; --line: #e1e6ef;
  --navy: #13294b; --blue: #1f5fbf; --sky: #2f8ae0; --gold: #e8aa42; --hover: #eaf1fc;
  --shadow: 0 10px 30px rgba(19, 41, 75, .14);
  --font: "Poppins", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px }
header.top { background: linear-gradient(120deg, #13294b, #1f5fbf 70%, #2f8ae0); color: #fff; padding-top: env(safe-area-inset-top, 0px) }
header.top .bar { max-width: 1180px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap }
.brand { display: flex; flex-direction: column; line-height: 1.15 }
.brand .who { font-weight: 300; font-size: 14px; opacity: .85 }
.brand .what { font-weight: 600; font-size: 22px; letter-spacing: .01em }
nav a { color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.12) }
nav a:hover, nav a:focus-visible { background: rgba(255,255,255,.24); outline: none }
/* hub */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; padding-top: 28px }
.tile { display: block; text-decoration: none; color: inherit; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(31, 95, 191, .28); outline: none }
.tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.tile .img { aspect-ratio: 16 / 9; background: var(--navy); overflow: hidden }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block }
.tile .name { padding: 14px 16px 16px; font-weight: 600; font-size: 16px; line-height: 1.3; text-wrap: balance }
/* session */
.session { padding-top: 26px; display: grid; gap: 22px; max-width: 960px; margin: 0 auto }
.session h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.25; text-wrap: balance; color: var(--ink) }
.player { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow) }
.player iframe, .player > div { position: absolute; inset: 0; width: 100%; height: 100% }
.outline { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.sec { background: var(--surface); border-radius: 12px; padding: 6px; box-shadow: 0 1px 0 var(--line) }
.sec.on { box-shadow: 0 0 0 2px var(--blue) }
.jump { display: flex; gap: 14px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 10px 12px; border-radius: 9px; cursor: pointer }
.jump:hover, .jump:focus-visible { background: var(--hover); outline: none }
.jump .t { flex: 0 0 auto; min-width: 58px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--blue); font-size: 14px }
.jump .x { min-width: 0 }
.sec > .jump .x { font-weight: 600; font-size: 16px }
.pts { list-style: none; margin: 0; padding: 0 0 4px 0 }
.pts .jump { padding: 7px 12px 7px 12px }
.pts .jump .t { font-weight: 500; color: var(--soft) }
.pts .jump .x { color: var(--ink); font-size: 14.5px }
.pts .jump:hover .t { color: var(--blue) }
@media (max-width: 560px) {
  .session h1 { font-size: 21px }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px }
  .tile .name { font-size: 14px; padding: 10px 12px 12px }
  .jump .t { min-width: 48px }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none } .tile:hover { transform: none } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><span class="who">Aaron Prickel · Mastery</span><span class="what">Increasing Show Rate</span></div>
  </div>
</header>
<main class="wrap">
  <section class="session">
    <div class="player"><div id="yt"></div></div>
    <ol class="outline"><li class="sec" data-s="0"><button class="jump" data-s="0"><span class="t">0:00</span><span class="x">Why Prospects Don&#x27;t Show</span></button><ul class="pts"><li><button class="jump" data-s="9"><span class="t">0:09</span><span class="x">No-shows trace back to lack of urgency, which comes from lack of pain</span></button></li><li><button class="jump" data-s="20"><span class="t">0:20</span><span class="x">Ask who convinced whom more to show up, them or you</span></button></li></ul></li>
<li class="sec" data-s="40"><button class="jump" data-s="40"><span class="t">0:40</span><span class="x">The Post-Sell That Fixed It</span></button><ul class="pts"><li><button class="jump" data-s="52"><span class="t">0:52</span><span class="x">Story: 30 people signed up for a demo and nobody showed</span></button></li><li><button class="jump" data-s="77"><span class="t">1:17</span><span class="x">Post-sell: you&#x27;re not the type who signs up and doesn&#x27;t show, are you?</span></button></li><li><button class="jump" data-s="97"><span class="t">1:37</span><span class="x">Compelling meetings don&#x27;t need reminders</span></button></li></ul></li>
<li class="sec" data-s="107"><button class="jump" data-s="107"><span class="t">1:47</span><span class="x">Diagnose the No-Show Pattern</span></button><ul class="pts"><li><button class="jump" data-s="107"><span class="t">1:47</span><span class="x">Check if no-shows reschedule easily or ghost you afterward</span></button></li><li><button class="jump" data-s="147"><span class="t">2:27</span><span class="x">Ask what the absent decision maker would say about this conversation</span></button></li><li><button class="jump" data-s="216"><span class="t">3:36</span><span class="x">No-shows often ghost because they feel guilty after being talked out of it</span></button></li></ul></li>
<li class="sec" data-s="237"><button class="jump" data-s="237"><span class="t">3:57</span><span class="x">Neutral Plan B Language</span></button><ul class="pts"><li><button class="jump" data-s="237"><span class="t">3:57</span><span class="x">Stay nonchalant: how do we reconnect for plan B time?</span></button></li><li><button class="jump" data-s="248"><span class="t">4:08</span><span class="x">Two reasons we don&#x27;t hear back: something changed, or life got crazy</span></button></li><li><button class="jump" data-s="291"><span class="t">4:51</span><span class="x">Wishy-washy hedge words give people an out</span></button></li></ul></li>
<li class="sec" data-s="376"><button class="jump" data-s="376"><span class="t">6:16</span><span class="x">Keep Prospects From Spoiling</span></button><ul class="pts"><li><button class="jump" data-s="376"><span class="t">6:16</span><span class="x">Check you got a reason, impact, and commitment, then post-sell hard</span></button></li><li><button class="jump" data-s="406"><span class="t">6:46</span><span class="x">Prospects are like bananas and spoil fast: what will you do meanwhile?</span></button></li><li><button class="jump" data-s="421"><span class="t">7:01</span><span class="x">What will you say to yourself to remember why you wanted this call?</span></button></li><li><button class="jump" data-s="465"><span class="t">7:45</span><span class="x">If they cancel, hand their own compelling reason back with plan B time</span></button></li></ul></li>
<li class="sec" data-s="491"><button class="jump" data-s="491"><span class="t">8:11</span><span class="x">Match the Question to the Contract</span></button><ul class="pts"><li><button class="jump" data-s="491"><span class="t">8:11</span><span class="x">Ask if it&#x27;s important enough to continue, not if they&#x27;re interested</span></button></li><li><button class="jump" data-s="528"><span class="t">8:48</span><span class="x">The harder you push for yeses, the more positive lies you get</span></button></li><li><button class="jump" data-s="579"><span class="t">9:39</span><span class="x">Closing question must match the outcome set in the up-front contract</span></button></li><li><button class="jump" data-s="645"><span class="t">10:45</span><span class="x">Each step only reduces risk: important enough to keep talking?</span></button></li></ul></li>
<li class="sec" data-s="665"><button class="jump" data-s="665"><span class="t">11:05</span><span class="x">Handling &#x27;Just Send Me an Email&#x27;</span></button><ul class="pts"><li><button class="jump" data-s="665"><span class="t">11:05</span><span class="x">Agree first, then ask what they&#x27;d like to see in the email</span></button></li><li><button class="jump" data-s="744"><span class="t">12:24</span><span class="x">Offer an email plus a five-minute block with a mini up-front contract</span></button></li><li><button class="jump" data-s="779"><span class="t">12:59</span><span class="x">Make fewer calls and listen to more of them</span></button></li></ul></li></ol>
  </section>
</main>
<script>
let player = null, ticker = null;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', { videoId: '5lRc6R696z0', host: 'https://www.youtube-nocookie.com',
    playerVars: { rel: 0, playsinline: 1, origin: location.origin },
    events: { onReady: () => { ticker = setInterval(mark, 1000); } } });
}
function mark() {
  if (!player || !player.getCurrentTime) return;
  const now = player.getCurrentTime(); let cur = -1;
  const secs = document.querySelectorAll('.sec');
  secs.forEach((el, i) => { if (+el.dataset.s <= now + 0.5) cur = i; });
  secs.forEach((el, i) => el.classList.toggle('on', i === cur));
}
document.addEventListener('click', e => {
  const b = e.target.closest('.jump'); if (!b) return;
  if (player && player.seekTo) { player.seekTo(+b.dataset.s, true); player.playVideo(); }
  const box = document.querySelector('.player');
  if (box.getBoundingClientRect().top < 0) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
