<style>
/* Layout: hub of slide-cover tiles -> one session per view: player on top, clickable outline under it */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #0f1f3d; --soft: #5b6884; --line: #e1e6ef;
  --navy: #13294b; --blue: #1f5fbf; --sky: #2f8ae0; --gold: #e8aa42; --hover: #eaf1fc;
  --shadow: 0 10px 30px rgba(19, 41, 75, .14);
  --font: "Poppins", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1424; --surface: #121e33; --ink: #e8eef9; --soft: #9aa8c2; --line: #22314d;
  --navy: #0d1d38; --blue: #5b9bf0; --sky: #6fb0ff; --gold: #f0b85a; --hover: #18284a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px }
header.top { background: linear-gradient(120deg, #13294b, #1f5fbf 70%, #2f8ae0); color: #fff; padding-top: env(safe-area-inset-top, 0px) }
header.top .bar { max-width: 1180px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap }
.brand { display: flex; flex-direction: column; line-height: 1.15 }
.brand .who { font-weight: 300; font-size: 14px; opacity: .85 }
.brand .what { font-weight: 600; font-size: 22px; letter-spacing: .01em }
nav a { color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.12) }
nav a:hover, nav a:focus-visible { background: rgba(255,255,255,.24); outline: none }
/* hub */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; padding-top: 28px }
.tile { display: block; text-decoration: none; color: inherit; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(31, 95, 191, .28); outline: none }
.tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.tile .img { aspect-ratio: 16 / 9; background: var(--navy); overflow: hidden }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block }
.tile .name { padding: 14px 16px 16px; font-weight: 600; font-size: 16px; line-height: 1.3; text-wrap: balance }
/* session */
.session { padding-top: 26px; display: grid; gap: 22px; max-width: 960px; margin: 0 auto }
.session h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.25; text-wrap: balance; color: var(--ink) }
.player { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow) }
.player iframe, .player > div { position: absolute; inset: 0; width: 100%; height: 100% }
.outline { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.sec { background: var(--surface); border-radius: 12px; padding: 6px; box-shadow: 0 1px 0 var(--line) }
.sec.on { box-shadow: 0 0 0 2px var(--blue) }
.jump { display: flex; gap: 14px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 10px 12px; border-radius: 9px; cursor: pointer }
.jump:hover, .jump:focus-visible { background: var(--hover); outline: none }
.jump .t { flex: 0 0 auto; min-width: 58px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--blue); font-size: 14px }
.jump .x { min-width: 0 }
.sec > .jump .x { font-weight: 600; font-size: 16px }
.pts { list-style: none; margin: 0; padding: 0 0 4px 0 }
.pts .jump { padding: 7px 12px 7px 12px }
.pts .jump .t { font-weight: 500; color: var(--soft) }
.pts .jump .x { color: var(--ink); font-size: 14.5px }
.pts .jump:hover .t { color: var(--blue) }
@media (max-width: 560px) {
  .session h1 { font-size: 21px }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px }
  .tile .name { font-size: 14px; padding: 10px 12px 12px }
  .jump .t { min-width: 48px }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none } .tile:hover { transform: none } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><span class="who">Aaron Prickel · Mastery</span><span class="what">Do You Hear What I Hear?</span></div>
  </div>
</header>
<main class="wrap">
  <section class="session">
    <div class="player"><div id="yt"></div></div>
    <ol class="outline"><li class="sec" data-s="0"><button class="jump" data-s="0"><span class="t">0:00</span><span class="x">Why listening is hard</span></button><ul class="pts"><li><button class="jump" data-s="68"><span class="t">1:08</span><span class="x">People will tell you how to sell them if you listen.</span></button></li><li><button class="jump" data-s="99"><span class="t">1:39</span><span class="x">Story: the knife set versus the knife sharpener, solving the real problem.</span></button></li></ul></li>
<li class="sec" data-s="169"><button class="jump" data-s="169"><span class="t">2:49</span><span class="x">What gets in the way</span></button><ul class="pts"><li><button class="jump" data-s="169"><span class="t">2:49</span><span class="x">Our own agendas and assuming we know what they&#x27;ll say.</span></button></li><li><button class="jump" data-s="238"><span class="t">3:58</span><span class="x">DISC style clashes and critical parent tone trigger rebellious child.</span></button></li><li><button class="jump" data-s="330"><span class="t">5:30</span><span class="x">DISC is about adapting briefly to build rapport, not being fake.</span></button></li></ul></li>
<li class="sec" data-s="363"><button class="jump" data-s="363"><span class="t">6:03</span><span class="x">You can&#x27;t listen your way out of a sale</span></button><ul class="pts"><li><button class="jump" data-s="380"><span class="t">6:20</span><span class="x">Use the 70-30 rule early; move toward 50-50 at advisor status.</span></button></li><li><button class="jump" data-s="463"><span class="t">7:43</span><span class="x">A prospect who&#x27;s listening is no prospect at all.</span></button></li><li><button class="jump" data-s="473"><span class="t">7:53</span><span class="x">Don&#x27;t get creative; their answer arms you with your next question.</span></button></li></ul></li>
<li class="sec" data-s="483"><button class="jump" data-s="483"><span class="t">8:03</span><span class="x">Focus on them, remove the pressure</span></button><ul class="pts"><li><button class="jump" data-s="518"><span class="t">8:38</span><span class="x">Beyonce lunch: with genuine interest, focus is on them.</span></button></li><li><button class="jump" data-s="563"><span class="t">9:23</span><span class="x">Worst-case thinking in your head blocks hearing the prospect.</span></button></li><li><button class="jump" data-s="612"><span class="t">10:12</span><span class="x">The best sellers take the thinking out of selling.</span></button></li></ul></li>
<li class="sec" data-s="643"><button class="jump" data-s="643"><span class="t">10:43</span><span class="x">Parroting, paraphrasing, and listening types</span></button><ul class="pts"><li><button class="jump" data-s="643"><span class="t">10:43</span><span class="x">Don&#x27;t echo back the exact same words; it costs credibility.</span></button></li><li><button class="jump" data-s="682"><span class="t">11:22</span><span class="x">Parrot their word, like &quot;hoops,&quot; to talk the way they talk.</span></button></li><li><button class="jump" data-s="690"><span class="t">11:30</span><span class="x">Paraphrase: boil three sentences into a few words of your own.</span></button></li><li><button class="jump" data-s="735"><span class="t">12:15</span><span class="x">David Sandler built the method from his observations of therapy.</span></button></li><li><button class="jump" data-s="789"><span class="t">13:09</span><span class="x">Detached, passive, and active listening.</span></button></li></ul></li>
<li class="sec" data-s="853"><button class="jump" data-s="853"><span class="t">14:13</span><span class="x">Active listening in action</span></button><ul class="pts"><li><button class="jump" data-s="853"><span class="t">14:13</span><span class="x">&quot;We&#x27;d love to work with you but funding&#x27;s cut&quot;: ask why they want to.</span></button></li><li><button class="jump" data-s="942"><span class="t">15:42</span><span class="x">Men listen only for facts; we hear what follows the &quot;but.&quot;</span></button></li><li><button class="jump" data-s="1056"><span class="t">17:36</span><span class="x">Fixing the problem before understanding it makes us poor listeners.</span></button></li><li><button class="jump" data-s="1072"><span class="t">17:52</span><span class="x">S styles listen best; I and D styles struggle.</span></button></li></ul></li>
<li class="sec" data-s="1123"><button class="jump" data-s="1123"><span class="t">18:43</span><span class="x">Stay genuinely curious</span></button><ul class="pts"><li><button class="jump" data-s="1123"><span class="t">18:43</span><span class="x">Be curious for them, not for yourself, like the veteran tour guide.</span></button></li><li><button class="jump" data-s="1236"><span class="t">20:36</span><span class="x">Two risky assumptions: &quot;we&#x27;re okay&quot; means okay, and what they can spend.</span></button></li><li><button class="jump" data-s="1374"><span class="t">22:54</span><span class="x">Tone is the best nuanced giveaway.</span></button></li></ul></li>
<li class="sec" data-s="1397"><button class="jump" data-s="1397"><span class="t">23:17</span><span class="x">Honest, non-manipulative questions</span></button><ul class="pts"><li><button class="jump" data-s="1419"><span class="t">23:39</span><span class="x">Manipulation is deception; honest conversations go deeper.</span></button></li><li><button class="jump" data-s="1487"><span class="t">24:47</span><span class="x">Ask &quot;how will you know if this makes sense?&quot; not &quot;what&#x27;s preventing you?&quot;</span></button></li><li><button class="jump" data-s="1513"><span class="t">25:13</span><span class="x">Use interjections like &quot;No way. Seriously?&quot; after emotional comments.</span></button></li></ul></li>
<li class="sec" data-s="1546"><button class="jump" data-s="1546"><span class="t">25:46</span><span class="x">Notes and pre-call plans</span></button><ul class="pts"><li><button class="jump" data-s="1565"><span class="t">26:05</span><span class="x">Two note columns: technical and compelling, two to three words each.</span></button></li><li><button class="jump" data-s="1643"><span class="t">27:23</span><span class="x">Pre-call plan: upfront contract, ideal and minimal outcome, key questions, mindset.</span></button></li><li><button class="jump" data-s="1705"><span class="t">28:25</span><span class="x">Loose first-call upfront contract: no harm, no foul; last 10 minutes for next steps.</span></button></li></ul></li>
<li class="sec" data-s="1792"><button class="jump" data-s="1792"><span class="t">29:52</span><span class="x">Minimal acceptable outcome</span></button><ul class="pts"><li><button class="jump" data-s="1807"><span class="t">30:07</span><span class="x">Minimal acceptable must progress the conversation; a no is not minimal.</span></button></li><li><button class="jump" data-s="1965"><span class="t">32:45</span><span class="x">Three possible outcomes: no update, we&#x27;re in, or something changed.</span></button></li></ul></li>
<li class="sec" data-s="2053"><button class="jump" data-s="2053"><span class="t">34:13</span><span class="x">Hedge words and subjectivity</span></button><ul class="pts"><li><button class="jump" data-s="2082"><span class="t">34:42</span><span class="x">When you get emotionally involved, 70% of your skills go out the door.</span></button></li><li><button class="jump" data-s="2091"><span class="t">34:51</span><span class="x">Catch wishy-washy words like try, maybe, and I think so.</span></button></li><li><button class="jump" data-s="2118"><span class="t">35:18</span><span class="x">Pain lives in subjective words: better, faster, smoother.</span></button></li></ul></li>
<li class="sec" data-s="2141"><button class="jump" data-s="2141"><span class="t">35:41</span><span class="x">Wrap-up</span></button><ul class="pts"><li><button class="jump" data-s="2149"><span class="t">35:49</span><span class="x">The one talking the most is the most emotionally involved.</span></button></li><li><button class="jump" data-s="2227"><span class="t">37:07</span><span class="x">Too many notes and too much planning hurts; understand, don&#x27;t just hear.</span></button></li></ul></li></ol>
  </section>
</main>
<script>
let player = null, ticker = null;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', { videoId: 'GkNnjSTkPyk', host: 'https://www.youtube-nocookie.com',
    playerVars: { rel: 0, playsinline: 1, origin: location.origin },
    events: { onReady: () => { ticker = setInterval(mark, 1000); } } });
}
function mark() {
  if (!player || !player.getCurrentTime) return;
  const now = player.getCurrentTime(); let cur = -1;
  const secs = document.querySelectorAll('.sec');
  secs.forEach((el, i) => { if (+el.dataset.s <= now + 0.5) cur = i; });
  secs.forEach((el, i) => el.classList.toggle('on', i === cur));
}
document.addEventListener('click', e => {
  const b = e.target.closest('.jump'); if (!b) return;
  if (player && player.seekTo) { player.seekTo(+b.dataset.s, true); player.playVideo(); }
  const box = document.querySelector('.player');
  if (box.getBoundingClientRect().top < 0) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
